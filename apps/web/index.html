<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>T3 Orchestra</title>
    <script>
      // Apply the saved theme before first paint (dark is the default).
      (function () {
        var theme = 'dark';
        try {
          theme = localStorage.getItem('t3orchestra:theme') || localStorage.getItem('yardmaster:theme') || localStorage.getItem('t3board:theme') || 'dark';
        } catch (e) {}
        var root = document.documentElement;
        root.classList.toggle('dark', theme !== 'light');
        root.style.colorScheme = theme === 'light' ? 'light' : 'dark';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
